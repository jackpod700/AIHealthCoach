    .proposal { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
    .field { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
    .label { fill: #0f172a; font: 700 22px Arial, sans-serif; }
    .text { fill: #334155; font: 16px Arial, sans-serif; }
    .small { fill: #64748b; font: 13px Arial, sans-serif; }
    .white { fill: #ffffff; font: 700 15px Arial, sans-serif; }
  </style>
  <rect class="bg" width="1200" height="720"/>
