<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">S05 AI 채팅 화면 와이어프레임</title>
  <desc id="desc">사이드바, AI 채팅 메시지 영역, 제안 카드, 입력창, Today Panel로 구성된 채팅 화면 구조</desc>
  <style>
