  <rect class="auth" x="440" y="360" width="170" height="64" rx="18"/>
  <text class="text" x="492" y="398">/chat</text>
  <rect class="auth" x="230" y="490" width="170" height="64" rx="18"/>
  <text class="text" x="277" y="528">/calendar</text>
  <rect class="auth" x="440" y="490" width="170" height="64" rx="18"/>
  <text class="text" x="486" y="528">/records</text>
  <rect class="auth" x="650" y="490" width="170" height="64" rx="18"/>
  <text class="text" x="700" y="528">/foods</text>
  <rect class="auth" x="860" y="490" width="170" height="64" rx="18"/>
  <text class="text" x="904" y="528">/profile</text>
  <rect class="admin" x="860" y="360" width="170" height="64" rx="18"/>
  <text class="text" x="906" y="398">/admin</text>
  <rect class="error" x="96" y="360" width="170" height="64" rx="18"/>
