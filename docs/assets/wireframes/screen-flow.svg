  <path class="line" d="M423 184 C452 270 470 312 498 360"/>
  <path class="line" d="M423 280 C452 322 470 342 498 360"/>
  <path class="line" d="M770 200 C804 274 758 338 610 382"/>
  <path class="soft" d="M770 210 C714 250 620 248 508 248"/>
