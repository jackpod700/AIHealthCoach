spring.application.name=ai-health-coach-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_health_coach}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis.mapper-locations=classpath:/mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

spring.sql.init.mode=never

spring.ai.openai.api-key=${GMS_API_KEY}
spring.ai.openai.base-url=https://gms.ssafy.io/gmsapi/api.openai.com/v1/
spring.ai.openai.chat.completions-path=chat/completions
spring.ai.openai.chat.options.model=gpt-4o-mini

security.jwt.token.secret-key=${JWT_SECRET}
security.jwt.access-token-expiration-ms=3600000
security.jwt.refresh-token-expiration-ms=1209600000

security.cookie.secure=false
security.cookie.same-site=Lax

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

fatsecret.client-id=${FATSECRET_CLIENT_ID:}
fatsecret.client-secret=${FATSECRET_CLIENT_SECRET:}
fatsecret.token-url=${FATSECRET_TOKEN_URL:https://oauth.fatsecret.com/connect/token}
fatsecret.food-search-url=${FATSECRET_FOOD_SEARCH_URL:https://platform.fatsecret.com/rest/foods/search/v1}
fatsecret.scope=${FATSECRET_SCOPE:basic}
fatsecret.region=${FATSECRET_REGION:KR}
fatsecret.language=${FATSECRET_LANGUAGE:ko}

food-batch.enabled=${FOOD_BATCH_ENABLED:false}
food-batch.cron=${FOOD_BATCH_CRON:0 0 * * * *}
food-batch.chunk-size=${FOOD_BATCH_CHUNK_SIZE:20}
food-batch.max-retries=${FOOD_BATCH_MAX_RETRIES:3}
food-batch.max-candidates=${FOOD_BATCH_MAX_CANDIDATES:5}


# OAuth2 - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# OAuth2 - Naver
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:}
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email,profile_image
spring.security.oauth2.client.registration.naver.client-name=Naver

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# OAuth success/failure redirect
app.oauth.success-redirect-url=${OAUTH_SUCCESS_REDIRECT_URL:http://localhost:5173/oauth/success}
app.oauth.failure-redirect-url=${OAUTH_FAILURE_REDIRECT_URL:http://localhost:5173/login?oauth=fail}
