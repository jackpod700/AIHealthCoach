spring.application.name=ai-health-coach-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_health_coach}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis.mapper-locations=classpath:/mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

spring.sql.init.mode=never

# spring.ai.openai.api-key=${OPENAI_API_KEY}
# spring.ai.openai.chat.options.model=gpt-4o-mini
# spring.ai.openai.chat.options.temperature=0.7

spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.options.model=openai/gpt-oss-120b:free

security.jwt.token.secret-key=${JWT_SECRET}
security.jwt.access-token-expiration-ms=3600000
