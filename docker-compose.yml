services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-health-postgres
    environment:
      POSTGRES_DB: ai_health_coach
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_health_coach"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-importer:
    build:
      context: .
      dockerfile: data/Dockerfile
    container_name: ai-health-data-importer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ai_health_coach
      PGUSER: postgres
      PGPASSWORD: postgres
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: ai-health-backend
    depends_on:
      data-importer:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ai_health_coach
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    container_name: ai-health-redis
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
    container_name: ai-health-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"

volumes:
  postgres-data:
