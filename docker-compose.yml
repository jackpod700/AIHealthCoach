services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-health-postgres
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    environment:
      POSTGRES_DB: ai_health_coach
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_health_coach"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-importer:
    build:
      context: .
      dockerfile: data/Dockerfile
    container_name: ai-health-data-importer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ai_health_coach
      PGUSER: postgres
      PGPASSWORD: postgres
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
      FOOD_IMPORT_ENABLED: ${FOOD_IMPORT_ENABLED:-false}
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: ai-health-backend
    depends_on:
      data-importer:
        condition: service_completed_successfully
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/ai_health_coach?options=-c%20TimeZone=Asia/Seoul"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
      GMS_API_KEY: ${GMS_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      FATSECRET_CLIENT_ID: ${FATSECRET_CLIENT_ID}
      FATSECRET_CLIENT_SECRET: ${FATSECRET_CLIENT_SECRET}
      FATSECRET_SCOPE: ${FATSECRET_SCOPE:-basic}
      FATSECRET_REGION: ${FATSECRET_REGION:-KR}
      FATSECRET_LANGUAGE: ${FATSECRET_LANGUAGE:-ko}
      FOOD_BATCH_ENABLED: ${FOOD_BATCH_ENABLED:-false}
      FOOD_BATCH_CRON: "${FOOD_BATCH_CRON:-0 0 * * * *}"
      FOOD_BATCH_CHUNK_SIZE: ${FOOD_BATCH_CHUNK_SIZE:-20}
      FOOD_BATCH_MAX_RETRIES: ${FOOD_BATCH_MAX_RETRIES:-3}
      FOOD_BATCH_MAX_CANDIDATES: ${FOOD_BATCH_MAX_CANDIDATES:-5}
      OAUTH_SUCCESS_REDIRECT_URL: ${OAUTH_SUCCESS_REDIRECT_URL}
      OAUTH_FAILURE_REDIRECT_URL: ${OAUTH_FAILURE_REDIRECT_URL}
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    container_name: ai-health-redis
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: ai-health-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ai-health-prometheus
    depends_on:
      backend:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ai-health-grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
