services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-health-postgres
    environment:
      POSTGRES_DB: ai_health_coach
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_health_coach"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-importer:
    build:
      context: .
      dockerfile: data/Dockerfile
    container_name: ai-health-data-importer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ai_health_coach
      PGUSER: postgres
      PGPASSWORD: postgres
      FOOD_IMPORT_ENABLED: ${FOOD_IMPORT_ENABLED:-false}
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: ai-health-backend
    depends_on:
      data-importer:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ai_health_coach
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
      GMS_API_KEY: ${GMS_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    container_name: ai-health-redis
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
    container_name: ai-health-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ai-health-prometheus
    depends_on:
      backend:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ai-health-grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
